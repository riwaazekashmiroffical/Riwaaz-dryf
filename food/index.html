$('app').innerHTML=`<button class="bk" onclick="go('home')">‹ Back</button><div class="map-kicker">RIWAAZ-E-KASHMIR · DELIVERY</div><h2 style="font:600 34px 'Cormorant Garamond',serif">Track your order</h2><div class="track-layout one"><aside class="track-panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><h3 id="trk-rn">Your order</h3><div style="font-size:12px;color:#aebcad;margin-top:2px">Order ${esc(o.id)}</div></div><span class="track-pill" id="trk-pill">Checking…</span></div><div style="margin-top:14px;color:#b8c5b7;font-size:12px;letter-spacing:.08em">ESTIMATED DELIVERY</div><div class="track-eta" id="eta">—</div><div id="stt" style="font-size:15px;color:#f4e8c8;line-height:1.45">Checking your order…</div><div id="trk-pay"></div><ul class="track-steps" id="track-steps"></ul><div class="rider-box" id="rider-box" style="display:none"><div class="rider-avatar">🛵</div><div style="flex:1"><b id="rider-name"></b><div style="font-size:12px;color:#aebcad">Your Riwaaz-e-Kashmir delivery rider</div></div></div><div class="track-map" id="order-map" style="display:none;height:240px;margin-top:12px"></div><div class="track-help">This page updates by itself every few seconds. You can close it and come back with your order number.</div><a href="tel:${CFG.call.replace(/[^+\d]/g,'')}" class="btn w100" style="margin-top:14px;text-decoration:none;text-align:center">Need help? Call Riwaaz-e-Kashmir</a></aside></div>`;
const poll=async()=>{if(document.hidden||V!='track')return;try{const r=await fetch('/api/food/order?id='+encodeURIComponent(o.id)+'&phone='+encodeURIComponent(o.phone),{cache:'no-store'}),d=await r.json();
if(!r.ok){clearInterval(tm);$('stt').textContent=d.error||'Order not found. Check the order number and phone.';$('trk-pill').textContent='Not found';return}
const rn=esc(d.rn||'The restaurant');$('trk-rn').textContent=d.rn||'Your order';
if(['rejected','cancelled'].includes(d.st)){clearInterval(tm);$('track-steps').innerHTML='';$('trk-pay').innerHTML='';$('eta').textContent='Cancelled';$('trk-pill').textContent='Cancelled';
$('stt').textContent=d.reason==='payment not completed'?'This order was cancelled because the payment was not completed. You were not charged.':rn.replace(/&amp;/g,'&')+' could not take this order'+(d.reason&&d.st==='rejected'?' ('+String(d.reason).replace(/_/g,' ')+')':'')+'. '+(d.paid?'Your online payment will be refunded to the account you paid from.':'Nothing was charged.')+' Please call us if you need help.';return}
const labels=['Order placed','Restaurant preparing','Food ready','Out for delivery','Delivered'],idx={awaiting:-1,placed:0,accepted:1,ready:2,picked:3,delivered:4}[d.st];if(idx==null)return;
const acc=((d.trail||[]).find(x=>x.s==='accepted')||{}).t||0,left=Math.max(0,(d.prep||20)-Math.floor((Date.now()-acc)/60000)),who=d.rider||'Your rider';

const pill={awaiting:'Awaiting payment',placed:'Order sent',accepted:'Preparing',ready:'Food ready',picked:'On the way',delivered:'Delivered'}[d.st];
$('eta').textContent=eta;$('stt').textContent=msg;$('trk-pill').textContent=pill;
const pb=$('trk-pay');if(d.st==='awaiting'&&d.pay==='online'){if(!pb.firstChild){o.t=d.total;pb.innerHTML='<button class="btn a w100" style="margin-top:12px" onclick="payFromTrack()">Pay '+M(d.total)+' now</button>'}}else pb.innerHTML='';
$('track-steps').innerHTML=labels.map((x,i)=>`<li class="${i<idx?'done':i===idx?'active':''}"><i>${i<idx||idx===4?'✓':i+1}</i>${x}</li>`).join('');
const rb=$('rider-box');if(d.rider&&d.st!=='delivered'){$('rider-name').textContent=d.rider;rb.style.display='flex'}else rb.style.display='none';
if(d.restaurantLat!=null&&d.restaurantLng!=null&&!orderMap&&!window._tmap){window._tmap=1;loadL(()=>{window._tmap=0;if(V!='track'||orderMap||!window.L)return;const el=$('order-map');if(!el)return;el.style.display='block';orderMap=window.L.map('order-map',{zoomControl:true,scrollWheelZoom:false}).setView([+d.restaurantLat,+d.restaurantLng],15);mapTiles().addTo(orderMap);restaurantMarker=window.L.marker([+d.restaurantLat,+d.restaurantLng],{icon:markerIcon()}).addTo(orderMap).bindPopup(d.rn||'Restaurant');setTimeout(()=>orderMap&&orderMap.invalidateSize(),150)})}
if(d.st==='delivered')clearInterval(tm);
}catch(e){const x=$('stt');if(x)x.textContent='Reconnecting to order updates…'}};
poll();clearInterval(tm);tm=setInterval(poll,12000)}

function tshow(){const rt=$('rt'),pg=$('pg');if(!rt)return;const Ln=rt.getTotalLength(),to=F[trk],a=f0,t0=performance.now();cancelAnimationFrame(raf);pg.style.strokeDashoffset=Ln*(1-to);
(function s(t){let k=Math.min(1,(t-t0)/2200);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;f0=a+(to-a)*k;if(!$('mk')||!rt.isConnected)return;const p=rt.getPointAtLength(Ln*f0);$('mk').setAttribute('transform','translate('+p.x+','+p.y+')');const a1=rt.getPointAtLength(Math.max(0,Ln*f0-3)),b1=rt.getPointAtLength(Math.min(Ln,Ln*f0+3));let g=Math.atan2(b1.y-a1.y,b1.x-a1.x)*180/Math.PI;g=Math.max(-25,Math.min(25,g));$('rot').setAttribute('transform','rotate('+g+')');if(k<1)raf=requestAnimationFrame(s)})(t0);
