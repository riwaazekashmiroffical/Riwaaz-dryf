 const poll=async()=>{try{const r=await fetch('/api/food/order?id='+encodeURIComponent(id)+'&phone='+ph,{cache:'no-store'}),d=await r.json();
   if(!r.ok){clearInterval(trT);$('trm').classList.add('hide');$('tre').innerHTML='<div class="card pd"><p>'+esc(d.error||'Order not found.')+'</p><button class="btn big" style="margin-top:12px" id="bt">Try another order</button></div>';$('bt').onclick=()=>{sv('lo','');VA='';LAST=null;trackV()};return}
   $('rnm').textContent=d.rn;$('rav').textContent=d.rider?d.rider[0].toUpperCase():(d.rn||'K')[0];$('rsm').innerHTML=d.rider?'Rider '+esc(d.rider):'Order <span>'+esc(id)+'</span>';
   if(['rejected','cancelled'].includes(d.st)){clearInterval(trT);$('trm').classList.add('hide');$('tre').innerHTML='<div class="msg"><h3>We could not make this order</h3><p style="margin-top:6px">'+esc(d.rn)+' could not take this order'+(d.reason&&d.st==='rejected'?' ('+esc(d.reason.replace(/_/g,' '))+')':'')+'. Sorry about that. Nothing has been charged. Please call us and we will help you right away.</p><a class="btn" style="margin-top:12px" href="'+CFG.callHref+'">'+esc(CFG.call)+'</a></div>';return}
   const tAt=s=>((d.trail.find(x=>x.s===s)||{}).t)||0,ix={placed:0,accepted:1,ready:1,picked:3,delivered:4}[d.st];let eta='40 min';
   if(d.st==='accepted'){eta=Math.max(8,(d.prep||20)+15-Math.floor((Date.now()-tAt('accepted'))/60000))+' min'}else if(d.st==='ready')eta='15 min';else if(d.st==='picked')eta='8 min';else if(d.st==='delivered'){eta='Arrived';clearInterval(trT)}
   cur=ix;showT(eta)}catch(e){}};
 poll();trT=setInterval(poll,8000)}
/* ===================== events ===================== */
document.addEventListener('click',e=>{const t=e.target;let x;
 if(x=t.closest('[data-r]')){go('rest',x.dataset.r);return}
 if(x=t.closest('[data-c]')){CH=x.dataset.c;home();return}
 if(x=t.closest('[data-t]')){document.querySelectorAll('#tb button').forEach(b=>b.classList.toggle('on',b===x));const c=$('cat'+x.dataset.t);if(c)c.scrollIntoView({behavior:'smooth'});return}
 if(x=t.closest('[data-p]')){PREF=x.dataset.p;toast('Code '+PREF+' saved. Add items and apply it in your cart.');return}
 if(x=t.closest('[data-a]')){if(lock())return;const r=R(V==='cart'?CART.rid:VA);if(!r||!r.open)return toast('This kitchen is closed right now.');const d=dish(r,x.dataset.a);if(!d||!d.stock)return toast('Sold out, sorry.');if(setQ(r.id,d.id,1)){if(PROMO)applyPromo(PROMO.code);refresh()}return}
 if(x=t.closest('[data-p2]')){if(lock())return;const r=R(CART.rid);if(r&&setQ(r.id,x.dataset.p2,(CART.it[x.dataset.p2]||0)+1)){if(PROMO)applyPromo(PROMO.code);refresh()}return}
 if(x=t.closest('[data-m]')){if(lock())return;const r=R(CART.rid);if(r){setQ(r.id,x.dataset.m,(CART.it[x.dataset.m]||0)-1);if(PROMO&&cnt())applyPromo(PROMO.code);refresh()}return}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-r],[data-p]'))e.target.click()});
$('bk').onclick=()=>{history.length>1?history.back():go('home')};
$('cbb').onclick=()=>go('cart');$('tk').onclick=()=>go('track',LAST?LAST.id:'');
$('th').onclick=()=>{const d=document.documentElement;d.dataset.t=d.dataset.t==='dark'?'':'dark';sv('ft',d.dataset.t||'')};
if(ld('ft')==='dark')document.documentElement.dataset.t='dark';
$('ca').href=CFG.callHref;$('ca').textContent=CFG.call;$('br').textContent=CFG.brand;
history.replaceState({v:'home'},'');loadData();
</script></body></html>
