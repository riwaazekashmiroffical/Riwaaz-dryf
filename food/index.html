<label class="ac-lbl" for="acp">Mobile number</label><div class="ac-ph"><span>+91</span><input id="acp" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" placeholder="10-digit number" value="${esc(S.phone)}"></div>
<div class="ac-err" id="acer" role="alert"></div><button class="btn a w100" onclick="RKAccount.submit()">Send code</button>
<p class="ac-fine">${up?'Already registered? <a href="#" style="color:var(--gd)" onclick="RKAccount.start(\'in\');return false">Sign in</a>':'New here? <a href="#" style="color:var(--gd)" onclick="RKAccount.start(\'up\');return false">Create account</a>'}</p><button class="ac-link" style="width:100%" onclick="closeA()">Continue as Guest</button>${pv()}`},
otp:()=>`${back(S.mode)}<div class="ac-hero" style="padding-top:4px"><h4>Enter your code</h4><p>We sent a 6-digit code to +91 ${esc(S.phone||'XXXXXXXXXX')}.</p></div>
<label class="ac-lbl" for="aco">6-digit code</label><input id="aco" class="ac-otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······">
<div class="ac-err" id="acer" role="alert"></div><button class="btn a w100" onclick="RKAccount.verify()">Verify and continue</button>
<button class="ac-link" id="acrs" style="width:100%" disabled>Resend code in 30s</button>`,
soon:()=>`<div class="ac-hero" style="padding-top:34px"><div class="ac-seal">${ic('lock')}</div><h4>Customer accounts are coming soon</h4><p>We are getting sign-in ready. You can still order right now as a guest. No account is needed.</p></div>
<div class="ac-btns"><button class="btn a" onclick="closeA()">Continue as Guest</button><button class="btn" onclick="RKAccount.show('home')">Back</button></div>`,
dash:()=>{const u=S.user||{};const n=u.name||'Your name';return `<div class="ac-me"><div class="ac-av">${esc(n.trim().charAt(0).toUpperCase()||'R')}</div><div><b>${esc(n)}</b><small>${u.phone?'+91 '+esc(u.phone):'+91 ··········'}</small></div></div>
<div class="ac-grid">${[['profile','user','Profile'],['orders','bag','Orders'],['reorder','redo','Reorder'],['addr','pin','Addresses'],['fav','heart','Favourites'],['help','help','Help & support']].map(t=>`<button class="ac-tile" onclick="RKAccount.show('${t[0]}')">${ic(t[1])}${t[2]}</button>`).join('')}</div>
<button class="btn w100 ac-out" onclick="RKAccount.logout()">Log out</button>${pv()}`},
profile:()=>{const u=S.user||{};return `${back('dash')}<h4 class="ac-sec" style="border:0;margin-top:6px">Profile</h4><label class="ac-lbl" for="apn1">Full name</label><input id="apn1" value="${esc(u.name||'')}" placeholder="Your name" maxlength="60"><label class="ac-lbl" for="apn2">Mobile number</label><input id="apn2" value="${esc(u.phone||'')}" placeholder="Verified at sign-in" readonly class="ac-fld"><label class="ac-lbl" for="apn3">Email (optional)</label><input id="apn3" type="email" value="${esc(u.email||'')}" placeholder="you@example.com" maxlength="80"><button class="btn a w100" onclick="RKAccount.soon()">Save changes</button><p class="ac-fine">Your number is verified by OTP and cannot be edited here.</p>`},
orders:()=>`${back('dash')}<h4 class="ac-sec" style="border:0;margin-top:6px">Your orders</h4>${empty('bag','No orders yet','Orders placed while signed in will appear here, with tracking and receipts.','<button class="btn a" onclick="closeA()">Browse restaurants</button>')}`,
reorder:()=>`${back('dash')}<h4 class="ac-sec" style="border:0;margin-top:6px">Reorder</h4>${empty('redo','Nothing to reorder yet','After your first order, repeat it in one tap. Items are re-added at today\'s menu prices for you to review.','<button class="btn a" onclick="closeA()">Order now</button>')}`,
addr:()=>`${back('dash')}<h4 class="ac-sec" style="border:0;margin-top:6px">Saved addresses</h4>${empty('pin','No saved addresses','Save your home or work address for faster checkout.','<button class="btn a" onclick="RKAccount.soon()">Add address</button>')}`,
fav:()=>`${back('dash')}<h4 class="ac-sec" style="border:0;margin-top:6px">Favourites</h4>${empty('heart','No favourites yet','Restaurants and dishes you love will be kept here.','<button class="btn a" onclick="closeA()">Explore restaurants</button>')}`,
help:()=>`${back('dash')}<h4 class="ac-sec" style="border:0;margin-top:6px">Help & support</h4><div class="ac-btns"><a class="btn a" href="tel:${CFG.call.replace(/[^+\d]/g,'')}">Call ${esc(CFG.call)}</a><button class="btn" onclick="closeA();doneO=null;go('track')">Track an order</button></div><p class="ac-fine">A real person will help with orders, payments and delivery.</p>`
};
return {config,api,S,fmtOrder,show,
 render(){const v=S.view;if(v=='home'&&S.user)S.view='dash';const k=S.view=='in'||S.view=='up'?'form':S.view;return `<div class="apn ac" role="dialog" aria-modal="true" aria-label="My account"><div class="ac-top"><h3>My Account</h3><button class="ac-x" onclick="closeA()" aria-label="Close">✕</button></div>${V[k]()}</div>`},
 start(m){S.mode=m;show(m)},
 soon(){show('soon')},
 submit(){const p=(($('acp')||{}).value||'').replace(/\D/g,'');if(!/^[6-9]\d{9}$/.test(p))return err('Please enter a valid 10-digit mobile number.');S.phone=p;if(S.mode=='up'){const n=($('acn').value||'').trim();if(n.length<2)return err('Please enter your name.');S.name=n}
  api('requestOtp',{method:'POST',body:{phone:p,name:S.name}}).then(r=>{if(r&&r.soon&&!S.preview)return show('soon');if(r&&r.error)return err(r.error);show('otp')}).catch(()=>err('Could not send the code. Please try again.'))},
 verify(){const c=(($('aco')||{}).value||'').replace(/\D/g,'');if(c.length!=6)return err('Please enter the 6-digit code.');
  api('verifyOtp',{method:'POST',body:{phone:S.phone,code:c,name:S.name}}).then(r=>{if(r&&r.soon)return show('soon');if(r&&r.user){S.user=r.user;return show('dash')}err((r&&r.error)||'That code is not correct.')}).catch(()=>err('Could not verify. Please try again.'))},
 logout(){api('logout',{method:'POST'}).then(()=>{S.user=null;show('home')})},
 reorder(id){api('reorder',{method:'POST',id}).then(r=>{if(r&&r.soon)show('soon')})}
};
})();
