<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rider | Riwaaz-e-Kashmir</title>
<meta name="robots" content="noindex, nofollow"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#0f1a13">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1a13;--bg2:#14201a;--bg3:#1b2a21;--gold:#c9a961;--ivory:#f3ead7;--mute:#a9b4a8;--line:#2b3f33;--ok:#6fbf8a;--bad:#d9785f;--warn:#e0a63c;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:400 16px/1.5 Jost,system-ui,sans-serif;background:var(--bg);color:var(--ivory);min-height:100vh;padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom));touch-action:manipulation}
button,input{font:inherit;color:inherit}
.w{max-width:560px;margin:0 auto;padding:0 14px}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.1}
header{position:sticky;top:0;z-index:20;background:var(--bg2);border-bottom:1px solid var(--gold)}
.hr{display:flex;align-items:center;gap:10px;padding:10px 0}.hr .t{flex:1;min-width:0}.hr small{display:block;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold)}.hr h1{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 16px;border-radius:12px;border:1px solid var(--gold);background:var(--gold);color:#14110a;font-weight:500;cursor:pointer;text-decoration:none}
.btn.o{background:transparent;color:var(--gold)}.btn.g{border-color:var(--ok);background:var(--ok);color:#0b1a10}.btn:disabled{opacity:.5}.btn.sm{min-height:42px;padding:8px 12px;font-size:14px}
.gps{display:flex;align-items:center;gap:8px;margin:12px 0;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg3);font-size:14px}
.gps i{width:10px;height:10px;border-radius:50%;background:var(--bad);flex:none}.gps.on i{background:var(--ok)}.gps span{flex:1}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.oh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.oh b{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--gold)}
.tag{font-size:12px;padding:3px 9px;border:1px solid var(--line);border-radius:10px;color:var(--mute)}.tag.cod{border-color:var(--warn);color:var(--warn)}.tag.ok{border-color:var(--ok);color:var(--ok)}
.lbl{margin-top:12px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold)}
.big{font-size:18px;margin-top:2px}.mu{color:var(--mute);font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.row.one{grid-template-columns:1fr}
.empty{padding:34px 10px;text-align:center;color:var(--mute)}
label{display:block;font-size:12px;color:var(--mute);margin:12px 0 4px}
input[type=text],input[type=password]{width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg3);color:var(--ivory);font-size:16px}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:20px}
.login{max-width:420px;margin:30px auto}.login h2{font-size:30px;margin:14px 0 4px}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--gold);color:#14110a;padding:10px 18px;border-radius:22px;font-size:14px;z-index:50;max-width:90vw}
</style></head><body>
<div id="lg" class="hide"><div class="w login">
<p style="font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold)">Riwaaz-e-Kashmir</p><h2>Rider login</h2>
<p style="color:var(--mute)">Use the ID and password we gave you.</p>
<form id="lf"><label for="li">Login ID</label><input id="li" type="text" autocomplete="username" autocapitalize="none" required>
<label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required>
<p class="err" id="le" role="alert"></p><button class="btn" style="width:100%" type="submit">Log in</button></form></div></div>

<div id="ap" class="hide">
<header><div class="w"><div class="hr"><div class="t"><small>Delivery rider</small><h1 id="nm">Rider</h1></div><button class="btn o sm" id="lo">Log out</button></div></div></header>
<div class="w">
<div class="gps" id="gps"><i></i><span id="gt">Location sharing is off.</span><button class="btn sm o" id="gb">Turn on</button></div>
<div id="ov"></div>
<p class="mu" style="text-align:center;margin-top:16px" id="up"></p>
<p class="mu" style="text-align:center;margin-top:6px">Keep this page open and the screen on while you deliver, so customers can see where you are.</p>
</div></div>
<div id="tt" class="toast hide"></div>

<script>
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TK=null,ORD=[],TODAY={n:0,cash:0},LASTD=null,watch=null,pos=null,lastPing=0,gpsOn=false,wl=null,tmr=null;
try{TK=localStorage.getItem('rr_tk')}catch(e){}
function toast(m){const t=$('tt');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hide'),2600)}
async function api(b){try{const r=await fetch('/api/food/rider',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({token:TK},b))}),j=await r.json().catch(()=>({}));if(r.status===401&&j.login){out();return {error:'login'}}return Object.assign({_s:r.status},j)}catch(e){return {error:'No internet connection.'}}}
function out(){TK=null;try{localStorage.removeItem('rr_tk')}catch(e){}stopGps();clearInterval(tmr);$('ap').classList.add('hide');$('lg').classList.remove('hide')}
$('lf').onsubmit=async e=>{e.preventDefault();$('le').textContent='';const r=await api({action:'login',id:$('li').value.trim(),password:$('lp').value});if(!r.ok){$('le').textContent=r.error||'Could not log in.';return}TK=r.token;try{localStorage.setItem('rr_tk',TK)}catch(e){}$('nm').textContent=r.name||'Rider';start()};
$('lo').onclick=out;
function nav(lat,lng,addr){return lat!=null&&lng!=null?`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr+' Srinagar')}`}
function card(o){const cod=o.pay==='cod',ready=o.st==='ready',picked=o.st==='picked';
 let act='';if(o.st==='accepted')act='<p class="mu" style="margin-top:12px">The kitchen is still cooking. Go to the restaurant.</p>';
 else if(ready)act=`<div class="row one"><button class="btn" data-a="picked" data-o="${esc(o.id)}">I picked up the food</button></div>`;
 else if(picked)act=`<div class="row one"><button class="btn g" data-a="delivered" data-o="${esc(o.id)}" data-c="${cod?o.total:0}">Delivered${cod?' - cash Rs '+o.total+' collected':''}</button></div>`;
 return `<div class="card"><div class="oh"><b>${esc(String(o.id).slice(-9))}</b><span class="tag ${cod?'cod':'ok'}">${cod?'Collect Rs '+o.total+' cash':(o.paid?'Paid online':'Check payment')}</span></div>
 <div class="lbl">1. Pick up from</div><p class="big">${esc(o.rn)}</p>${o.rlat!=null?`<div class="row one"><a class="btn o sm" href="${nav(o.rlat,o.rlng,o.rn)}" target="_blank" rel="noopener">Directions to restaurant</a></div>`:''}
 <div class="lbl">2. Deliver to</div><p class="big">${esc(o.name)} - ${esc(o.zone)}</p><p class="mu">${esc(o.addr)}</p>${o.note?`<p class="mu">Note: ${esc(o.note)}</p>`:''}
 <div class="row"><a class="btn o sm" href="tel:${esc(o.phone)}">Call ${esc(o.phone)}</a><a class="btn o sm" href="${nav(o.clat,o.clng,o.addr)}" target="_blank" rel="noopener">${o.clat!=null?'Directions (pin)':'Search address'}</a></div>
 <p class="mu" style="margin-top:10px">${o.lines.map(l=>l.q+'x '+esc(l.n)).join(', ')}</p>${act}</div>`}
function draw(){const dn=LASTD?`<div class="card" style="border-color:var(--ok)"><div class="oh"><b style="color:var(--ok)">Delivered ✓</b><span class="tag ok">${esc(String(LASTD.id).slice(-9))}</span></div><p class="mu" style="margin-top:6px">${LASTD.cash?'Cash Rs '+LASTD.cash+' collected. Keep it safe for hand-over.':'Thank you. Marked as delivered.'}</p></div>`:'',sm=`<div class="card"><div class="oh"><span class="lbl" style="margin:0">Today</span><span class="mu">${TODAY.n} delivered</span></div>${TODAY.cash?`<p class="big" style="margin-top:6px">Cash to hand over: <b style="color:var(--gold)">Rs ${TODAY.cash}</b></p>`:''}</div>`;$('ov').innerHTML=dn+(ORD.length?ORD.map(card).join(''):'<div class="empty">No delivery assigned to you right now.<br>New orders appear here by themselves.</div>')+sm}
async function load(){const r=await api({action:'orders'});if(r.error){if(r.error!=='login')$('up').textContent='No internet. Showing the last list.';return}ORD=r.orders||[];TODAY=r.today||TODAY;if(r.name)$('nm').textContent=r.name;draw();$('up').textContent='Updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});ping()}
$('ov').onclick=async e=>{const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a;if(a==='delivered'&&!confirm('Mark this order as delivered?'))return;b.disabled=true;const r=await api({action:a,oid:b.dataset.o});if(r.ok){if(a==='delivered'){LASTD={id:b.dataset.o,cash:+(b.dataset.c||0)};setTimeout(()=>{LASTD=null;draw()},90000)}toast(a==='picked'?'Marked as picked up':'Delivered. Well done!');load()}else{b.disabled=false;toast(r.error||'Could not update. Try again.')}};
/* location */
function setGps(on,msg){gpsOn=on;$('gps').classList.toggle('on',on);$('gt').textContent=msg;$('gb').textContent=on?'Turn off':'Turn on'}
async function keepAwake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
function startGps(){if(!navigator.geolocation){setGps(false,'This phone cannot share location.');return}
 stopGps();watch=navigator.geolocation.watchPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude};setGps(true,'Sharing your location with customers.');ping()},er=>{setGps(false,er.code===1?'Location is blocked. Allow location for this site in the browser settings.':'Waiting for GPS signal…')},{enableHighAccuracy:true,maximumAge:10000,timeout:30000});keepAwake()}
function stopGps(){if(watch!=null){navigator.geolocation.clearWatch(watch);watch=null}pos=null;setGps(false,'Location sharing is off.');try{wl&&wl.release()}catch(e){}wl=null}
$('gb').onclick=()=>{if(gpsOn){stopGps();try{localStorage.setItem('rr_gps','0')}catch(e){}}else{startGps();try{localStorage.setItem('rr_gps','1')}catch(e){}}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&gpsOn)keepAwake()});
function ping(){if(!gpsOn||!pos||Date.now()-lastPing<14000)return;const act=ORD.filter(o=>['ready','picked'].includes(o.st));if(!act.length)return;lastPing=Date.now();act.forEach(o=>api({action:'ping',oid:o.id,lat:pos.lat,lng:pos.lng}))}
function start(){$('lg').classList.add('hide');$('ap').classList.remove('hide');load();clearInterval(tmr);tmr=setInterval(()=>{if(!document.hidden)load()},12000);let g='1';try{g=localStorage.getItem('rr_gps')||'1'}catch(e){}if(g==='1')startGps()}
if(TK)start();else $('lg').classList.remove('hide');
</script></body></html>
