<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050D08">
<title>Delivery Control Centre | Riwaaz-e-Kashmir</title>
<style>
:root{--bg:#050D08;--sf:#0B1B12;--gold:#D4AF37;--cr:#F2E6C0;--mu:rgba(242,230,192,.66);--ln:rgba(212,175,55,.26);--warn:#EE8F74;--ok:#86D6A6;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1200px 500px at 50% -200px,#10281a,var(--bg));background-color:var(--bg);color:var(--cr);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
button{min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--ln);background:transparent;font-weight:600;cursor:pointer}
button.go{background:var(--gold);border-color:var(--gold);color:#1b1505}
button:disabled{opacity:.5;cursor:default}
input,select{min-height:48px;width:100%;padding:0 14px;border-radius:12px;border:1px solid var(--ln);background:#06120B}
select{appearance:auto}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:var(--gold)}
h1,h2{font-family:var(--serif);font-weight:600;margin:0}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-family:var(--serif);font-size:22px;color:var(--gold);flex:none}

/* sign in */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
#login form{width:min(420px,100%);background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:28px;display:grid;gap:14px}
#login h1{font-size:28px;line-height:1.15}
#login p{margin:0;color:var(--mu)}
#lerr{color:var(--warn);min-height:1.4em;font-weight:600}

/* dashboard */
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:18px clamp(14px,3vw,32px);border-bottom:1px solid var(--ln);position:sticky;top:0;background:rgba(5,13,8,.94);backdrop-filter:blur(8px);z-index:5}
header h1{font-size:clamp(20px,3.4vw,28px);line-height:1.1}
header small{display:block;color:var(--mu);font-size:14px}
.hr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#upd{color:var(--mu);font-size:14px}
#upd.bad{color:var(--warn);font-weight:600}
nav{display:flex;gap:10px;flex-wrap:wrap;padding:16px clamp(14px,3vw,32px) 4px}
nav button{border-radius:999px;min-height:44px}
nav button[aria-pressed=true]{background:var(--gold);color:#1b1505;border-color:var(--gold)}
nav b{margin-left:8px;font-variant-numeric:tabular-nums}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px;padding:16px clamp(14px,3vw,32px) 48px}
#empty{padding:48px 24px;text-align:center;color:var(--mu)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card.need{border-color:var(--gold);box-shadow:0 0 0 1px rgba(212,175,55,.25)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ref{font-family:var(--serif);font-size:26px;color:var(--gold);line-height:1.1}
.ago{color:var(--mu);font-size:14px}
.pill{border:1px solid var(--ln);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.pill.accepted{border-color:var(--gold);color:var(--gold)}
.pill.ready{background:var(--gold);color:#1b1505;border-color:var(--gold)}
.pill.picked{border-color:var(--ok);color:var(--ok)}
.pill.delivered{color:var(--mu)}
.rows{display:grid;gap:6px;margin:0}
.rows div{display:grid;grid-template-columns:92px 1fr;gap:8px}
.rows dt{color:var(--mu)}
.rows dd{margin:0;overflow-wrap:anywhere}
.rd{border-top:1px solid var(--ln);padding-top:12px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ok{color:var(--ok);font-weight:600}
.warn{color:var(--warn);font-weight:600}
.as{display:grid;grid-template-columns:1fr auto;gap:10px}
.note{margin:0;color:var(--mu);font-size:15px}
.note.warn{color:var(--warn)}
@media(max-width:480px){.as{grid-template-columns:1fr}.rows div{grid-template-columns:78px 1fr}}

/* dialog + toast */
dialog{background:var(--sf);color:var(--cr);border:1px solid var(--gold);border-radius:18px;padding:24px;width:min(440px,calc(100% - 32px))}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h2{font-size:22px;margin-bottom:8px}
dialog p{margin:0 0 18px;color:var(--mu)}
dialog .btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 28px));z-index:20;display:grid;gap:8px;pointer-events:none}
#toast div{background:#12301f;border:1px solid var(--ok);border-radius:14px;padding:14px 16px;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.5)}
#toast div.e{background:#3a1a12;border-color:var(--warn)}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
</style>
</head>
<body>

<section id="login">
  <form id="lf" autocomplete="on">
    <div class="brand"><div class="mark" aria-hidden="true">R</div><div><h1>Delivery Control Centre</h1></div></div>
    <p>Riwaaz-e-Kashmir dispatch. Sign in with your dispatch account.</p>
    <label>Login ID<input id="lid" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
    <label>Password<input id="lpw" name="password" type="password" autocomplete="current-password" required></label>
    <div id="lerr" role="alert"></div>
    <button class="go" id="lgo" type="submit">Sign in</button>
  </form>
</section>

<main id="app" hidden>
  <header>
    <div class="brand"><div class="mark" aria-hidden="true">R</div><div><h1>Delivery Control Centre</h1><small>Riwaaz-e-Kashmir dispatch</small></div></div>
    <div class="hr"><span id="upd">Not updated yet</span><button id="rf" type="button">Refresh</button><button id="lo" type="button">Sign out</button></div>
  </header>
  <nav id="chips" aria-label="Order filter"></nav>
  <div id="grid"></div>
  <p id="empty" hidden></p>
</main>

<dialog id="dlg"><h2 id="dt"></h2><p id="dm"></p><div class="btns"><button id="dn" type="button">Keep current rider</button><button id="dy" class="go" type="button">Reassign</button></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(()=>{
'use strict';
/* Endpoints used (all existing): POST /api/food/dispatch with action login | orders | riders | assign */
const API='/api/food/dispatch',POLL=25000,RIDER_TTL=300000;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={placed:'Waiting for kitchen',accepted:'Being prepared',ready:'Ready for pickup',picked:'On the way',delivered:'Delivered'};
const RANK={ready:0,accepted:1,placed:2,picked:3,delivered:4};
let tok=null,orders=[],riders=[],ridersAt=0,filter='active',timer=null,busy=false,dirty=false,lastOk=0,picks={};
try{tok=sessionStorage.getItem('dc_tok')}catch(e){}

const needs=o=>!o.riderId&&['placed','accepted','ready'].includes(o.st);
const FILTERS=[['need','Needs a rider',needs],['active','Active',o=>o.st!=='delivered'],['done','Delivered',o=>o.st==='delivered'],['all','All',()=>true]];

function toast(m,bad){const d=document.createElement('div');d.textContent=m;if(bad)d.className='e';$('toast').appendChild(d);setTimeout(()=>d.remove(),bad?7000:4500)}

async function api(action,extra){
  let r;
  try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tok,action,...extra})})}
  catch(e){throw{net:true,message:'No connection.'}}
  let d={};try{d=await r.json()}catch(e){}
  if(action!=='login'&&(r.status===401||d.login)){expire();throw{auth:true,message:'Session expired.'}}
  if(!r.ok)throw{message:d.error||'Something went wrong.',status:r.status};
  return d;
}

/* ---------- session ---------- */
function showLogin(msg){
  clearInterval(timer);timer=null;
  $('app').hidden=true;$('login').hidden=false;$('grid').textContent='';
  $('lerr').textContent=msg||'';$('lpw').value='';
  (msg?$('lpw'):$('lid')).focus();
}
function expire(){tok=null;orders=[];riders=[];picks={};try{sessionStorage.removeItem('dc_tok')}catch(e){}showLogin('Your session has expired. Please sign in again.')}
function showApp(){
  $('login').hidden=true;$('app').hidden=false;
  clearInterval(timer);timer=setInterval(()=>{if(!document.hidden&&tok)refresh()},POLL);
  refresh(true);
}
$('lf').addEventListener('submit',async e=>{
  e.preventDefault();const b=$('lgo');b.disabled=true;$('lerr').textContent='';
  try{
    tok=null;const d=await api('login',{id:$('lid').value.trim(),password:$('lpw').value});
    if(d.role!=='dispatch'){$('lerr').textContent='This account is not a dispatch account.';return}
    tok=d.token;try{sessionStorage.setItem('dc_tok',tok)}catch(x){}
    $('lpw').value='';showApp();
  }catch(er){$('lerr').textContent=er.net?'No connection. Check the internet and try again.':er.message}
  finally{b.disabled=false}
});
$('lo').addEventListener('click',()=>{tok=null;orders=[];riders=[];picks={};try{sessionStorage.removeItem('dc_tok')}catch(e){}showLogin('');toast('Signed out.')});

/* ---------- data ---------- */
async function refresh(manual){
  if(busy||!tok)return;busy=true;$('rf').disabled=true;
  try{
    const stale=manual||!riders.length||Date.now()-ridersAt>RIDER_TTL;
    const [od,rd]=await Promise.all([api('orders'),stale?api('riders'):null]);
    orders=od.orders||[];if(rd){riders=rd.riders||[];ridersAt=Date.now()}
    lastOk=Date.now();$('upd').className='';$('upd').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    render();
  }catch(er){
    if(er.auth)return;
    $('upd').className='bad';$('upd').textContent=er.net?'Offline. Showing the last update, retrying.':er.message;
  }finally{busy=false;$('rf').disabled=false}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tok&&Date.now()-lastOk>POLL)refresh()});
$('rf').addEventListener('click',()=>refresh(true));

/* ---------- view ---------- */
const ago=ts=>{const m=Math.max(0,Math.round((Date.now()-ts)/60000));return m<1?'just now':m<60?m+' min ago':Math.floor(m/60)+' h '+(m%60)+' min ago'};
const nameOf=o=>((riders.find(r=>r.id===o.riderId)||{}).name)||o.rider||'';
const payTxt=o=>o.pay==='cod'?(o.paid?'Cash collected':'Cash on delivery'):o.pay==='online'?(o.paid?'Paid online':'Online, unpaid'):'UPI';

function render(){
  const g=$('grid');
  if(g.contains(document.activeElement)&&document.activeElement.tagName==='SELECT'){dirty=true;return}
  dirty=false;
  $('chips').innerHTML=FILTERS.map(([k,l,f])=>`<button type="button" data-f="${k}" aria-pressed="${k===filter}">${l}<b>${orders.filter(f).length}</b></button>`).join('');
  const f=(FILTERS.find(x=>x[0]===filter)||FILTERS[1])[2];
  const list=orders.filter(f).sort((a,b)=>(RANK[a.st]-RANK[b.st])||(b.ts-a.ts));
  g.innerHTML=list.map(card).join('');
  const em=$('empty');em.hidden=!!list.length;em.textContent=filter==='need'?'Every open order has a rider.':'No orders to show.';
  for(const k of Object.keys(picks))if(!orders.some(o=>o.id===k))delete picks[k];
}

function card(o){
  const locked=o.st==='picked'||o.st==='delivered';
  let rider='';
  if(o.rider)rider=`<div class="rd"><b>${esc(nameOf(o))}</b>${o.riderLinked?'<span class="ok">Linked to rider app</span>':'<span class="warn">Not linked: will not appear in any rider app</span>'}${o.riderPhone?`<a href="tel:${esc(o.riderPhone)}">${esc(o.riderPhone)}</a>`:''}</div>`;
  else if(!locked)rider='<div class="rd"><span class="warn">No rider assigned</span></div>';
  let ctl='';
  if(o.st==='picked')ctl='<p class="note">Picked up. The rider can no longer be changed.</p>';
  else if(o.st!=='delivered'){
    if(!riders.length)ctl='<p class="note warn">No active rider accounts. Create riders in Food Admin first.</p>';
    else ctl=`<div class="as"><select data-o="${esc(o.id)}" aria-label="Choose a rider for ${esc(o.ref||o.id)}"><option value="">Choose a rider</option>${riders.map(r=>`<option value="${esc(r.id)}"${picks[o.id]===r.id?' selected':''}>${esc(r.name)} (${esc(r.id)})</option>`).join('')}</select><button class="go" type="button" data-a="${esc(o.id)}">${o.rider?(o.riderLinked?'Reassign':'Link rider'):'Assign rider'}</button></div>`;
  }
  return `<article class="card${needs(o)?' need':''}"><div class="top"><div><div class="ref">${esc(o.ref||o.id)}</div><div class="ago">${esc(ago(o.ts))}</div></div><span class="pill ${esc(o.st)}">${esc(ST[o.st]||o.st)}</span></div>
<dl class="rows"><div><dt>Restaurant</dt><dd>${esc(o.rn)}</dd></div><div><dt>Customer</dt><dd>${esc(o.name)} <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></dd></div><div><dt>Address</dt><dd>${esc(o.addr)}${o.zone?', '+esc(o.zone):''}</dd></div><div><dt>Amount</dt><dd>&#8377;${esc(o.total)} &middot; ${esc(payTxt(o))}</dd></div></dl>${rider}${ctl}</article>`;
}

$('chips').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(b){filter=b.dataset.f;render()}});
$('grid').addEventListener('change',e=>{if(e.target.dataset.o)picks[e.target.dataset.o]=e.target.value});
$('grid').addEventListener('focusout',()=>{if(dirty)setTimeout(()=>{if(dirty&&document.activeElement.tagName!=='SELECT')render()},150)});
$('grid').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)startAssign(b.dataset.a,b)});

/* ---------- assign / reassign ---------- */
function ask(title,msg,yes,no){
  return new Promise(res=>{
    const d=$('dlg');
    if(!d.showModal){res(window.confirm(title+'\n'+msg));return}
    $('dt').textContent=title;$('dm').textContent=msg;$('dy').textContent=yes;$('dn').textContent=no;
    const done=v=>{d.close();$('dy').onclick=$('dn').onclick=null;res(v)};
    $('dy').onclick=()=>done(true);$('dn').onclick=()=>done(false);d.oncancel=()=>res(false);d.showModal();
  });
}
async function startAssign(oid,btn){
  const o=orders.find(x=>x.id===oid);if(!o)return;
  const sel=btn.parentNode.querySelector('select'),rid=sel.value||picks[oid];
  const ref=o.ref||o.id;
  if(!rid)return toast('Choose a rider for '+ref+' first.',true);
  const r=riders.find(x=>x.id===rid);
  if(!r)return toast('That rider is no longer available. Refresh the list.',true);
  if(o.st==='picked'||o.st==='delivered')return toast(ref+' has already been picked up, so the rider cannot be changed.',true);
  if(o.riderId===rid)return toast(ref+' is already assigned to '+r.name+'.',true);
  if(o.rider){
    const was=nameOf(o);
    if(!await ask('Reassign '+ref+'?',(o.riderLinked?was:was+' (not linked)')+' will lose this order and their location for it will be cleared. '+r.name+' will receive it instead.','Reassign to '+r.name,'Keep current rider'))return;
  }
  btn.disabled=true;
  try{
    const d=await api('assign',{oid:o.id,rider:r.id});
    if(!d.riderApp||!d.order||d.order.riderId!==r.id||!d.order.riderLinked){
      toast(ref+' was saved but is NOT linked to '+r.name+'. Do not rely on the rider app. Please refresh and try again.',true);
    }else toast(ref+' assigned to '+r.name+'. Rider app linked.');
    if(d.order){const i=orders.findIndex(x=>x.id===o.id);if(i>=0)orders[i]=d.order}
    delete picks[oid];
  }catch(er){
    if(er.auth)return;
    toast(er.net?'No connection. The assignment was not sent.':er.message,true);
    if(er.status===409)refresh(true);
  }finally{btn.disabled=false;render()}
}

/* ---------- start ---------- */
if(tok)showApp();else showLogin('');
})();
</script>
</body>
</html>
